<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <label for="difficulty">Difficulty</label>
  <select id="difficulty">
    <option value="easy">Easy</option>
    <option value="medium" selected>Medium</option>
    <option value="hard">Hard</option>
  </select>
  <div id="sudoku-board"></div>
  <div class="controls">
    <button id="new-game">New Game</button>
    <button id="check-solution">Check Solution</button>
    <button id="hint">Hint</button>
    <button id="dark-mode-toggle" type="button" aria-pressed="false">Dark Mode</button>
    <span id="timer" aria-live="off">00:00</span>
    <span id="message"></span>
  </div>
  <section class="leaderboard" aria-labelledby="leaderboard-title">
    <div class="leaderboard-heading">
      <h2 id="leaderboard-title">Top 10</h2>
      <label for="leaderboard-filter">Difficulty</label>
      <select id="leaderboard-filter">
        <option value="all" selected>All</option>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>
    <div class="leaderboard-table-wrap">
      <table>
        <thead>
          <tr>
            <th scope="col">Rank</th>
            <th scope="col">Name</th>
            <th scope="col">Time</th>
            <th scope="col">Difficulty</th>
            <th scope="col">Hints</th>
          </tr>
        </thead>
        <tbody id="leaderboard-entries"></tbody>
      </table>
    </div>
  </section>
  <script src="/static/leaderboard.js"></script>
  <script src="/static/main.js"></script>
</body>
</html>
